[project]
name = "project-1"
version = "0.1.0"
description = "Sequential conformal prediction for early failure detection in long-horizon manipulation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # --- the benchmark itself (path dep: clone lives in third_party/) ---
    "libero",
    # --- simulator core ---
    "robosuite==1.4.1",
    "mujoco>=3.1,<3.3",
    "bddl==1.0.1",
    # <2: robosuite 1.4 predates the numpy 2 ABI break.
    # <1.24: robomimic 0.2.0 uses np.bool, removed in 1.24. Pinning beats
    # patching site-packages -- it survives `uv sync` and applies inside
    # DataLoader workers. Matches LIBERO's own original numpy==1.22.4.
    "numpy>=1.22,<1.24",
    # --- imported by libero/libero (env + benchmark only) ---
    "easydict",
    "pyyaml",
    "termcolor",
    "tqdm",
    "imageio",
    "h5py",
    "cloudpickle",
    "matplotlib",
    "huggingface-hub",
    # --- policy side: CPU/MPS wheels, not the cu113 line from LIBERO's README ---
    "torch",
    "torchvision",
    "future>=1.0.0",
    "gym==0.26.2",
]

# LIBERO's setup.py declares install_requires=[], so installing it editable pulls
# nothing extra. The list above is that missing manifest.
#
# The `lifelong` training stack (robomimic / wandb / transformers / hydra / thop)
# was removed on 2026-09-08 along with the BC-Transformer scripts that imported
# it -- the policy is now a frozen pretrained checkpoint, not something we train.
# It is recoverable from git history if training ever returns.
#
# NOTE: `numpy<1.24` above was originally pinned for robomimic's use of np.bool.
# robomimic is gone, so only the `<2` half (robosuite 1.4's ABI) is still load-
# bearing. The tighter pin is kept deliberately: relaxing it would re-resolve the
# env that produced the recorded numbers. Loosen it only with a fresh eval.

[tool.uv]
package = false

[tool.uv.sources]
# Editable so bddl_files/ + assets/ resolve from the checkout in place.
# Bootstrap on a fresh machine:
#   git clone --depth 1 https://github.com/Lifelong-Robot-Learning/LIBERO.git third_party/LIBERO
libero = { path = "third_party/LIBERO", editable = true }
